name: Fast-Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${OWNER}/${NAME}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${OWNER}/${NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Fast-Release
        env:
          FAST_RELEASE_API_URL: ${{ secrets.FAST_RELEASE_API_URL }}
          FAST_RELEASE_DEPLOY_TOKEN: ${{ secrets.FAST_RELEASE_DEPLOY_TOKEN }}
          FAST_RELEASE_PROJECT_ID: ${{ secrets.FAST_RELEASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${FAST_RELEASE_API_URL:-}" ] || [ -z "${FAST_RELEASE_DEPLOY_TOKEN:-}" ] || [ -z "${FAST_RELEASE_PROJECT_ID:-}" ]; then
            echo "Missing Fast-Release secrets (FAST_RELEASE_API_URL, FAST_RELEASE_DEPLOY_TOKEN, FAST_RELEASE_PROJECT_ID)"
            exit 1
          fi
          API_URL="${FAST_RELEASE_API_URL%/}"
          curl -fS -X POST "${API_URL}/webhooks/deploy" \
            -H "Authorization: Bearer ${FAST_RELEASE_DEPLOY_TOKEN}" \
            -H "X-Fast-Release-Project-Id: ${FAST_RELEASE_PROJECT_ID}" \
            -H "X-Fast-Release-Commit: ${{ github.sha }}" \
            -H "Content-Type: application/json" \
            -d "{\"imageRef\":\"${{ steps.image.outputs.ref }}\",\"commitSha\":\"${{ github.sha }}\"}"
